<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Illustration of the AI QA Scenario Studio checkout plan</title>
  <desc id="description">A sample checkout story on the left and a reviewable scenario matrix on the right, with positive, negative, happy-path, edge, and boundary cases.</desc>
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f5f4ee"/>
  <rect x="0" y="0" width="1440" height="72" fill="#fff" stroke="#e8e7e0"/>
  <rect x="50" y="20" width="34" height="34" rx="10" fill="#111a2b"/>
  <text x="61" y="43" fill="#fff" font-size="17" font-weight="700" class="sans">S<tspan fill="#b9edcf">·</tspan></text>
  <text x="96" y="43" fill="#121b2c" font-size="16" font-weight="700" class="sans">scenario<tspan fill="#76808e" font-weight="400">studio</tspan></text>
  <text x="1020" y="42" fill="#596273" font-size="13" class="sans">Workspace</text>
  <text x="1115" y="42" fill="#596273" font-size="13" class="sans">Evaluation set ↗</text>
  <text x="1265" y="42" fill="#596273" font-size="13" class="sans">Sample shop ↗</text>
  <rect x="50" y="101" width="1340" height="58" rx="8" fill="#fffdf8" stroke="#e8e7e0"/>
  <circle cx="78" cy="130" r="7" fill="#54a982"/>
  <text x="96" y="135" fill="#596273" font-size="13" letter-spacing="1" class="mono">PUBLIC DEMO · SAMPLE INFORMATION ONLY · NOTHING IS SAVED</text>
  <rect x="50" y="181" width="388" height="665" rx="12" fill="#fff" stroke="#e8e7e0"/>
  <text x="77" y="220" fill="#7b8390" font-size="11" letter-spacing="1.7" class="mono">01 / THE BRIEF</text>
  <text x="77" y="251" fill="#121b2c" font-size="23" font-weight="700" class="sans">Set the scene</text>
  <text x="77" y="293" fill="#4d5665" font-size="13" font-weight="700" class="sans">Product or website</text>
  <rect x="77" y="303" width="334" height="40" rx="6" fill="#fbfbf9" stroke="#e3e4e7"/>
  <text x="90" y="329" fill="#333d4c" font-size="13" class="sans">SauceDemo sample shop</text>
  <text x="77" y="373" fill="#4d5665" font-size="13" font-weight="700" class="sans">Feature under test</text>
  <rect x="77" y="383" width="334" height="40" rx="6" fill="#fbfbf9" stroke="#e3e4e7"/>
  <text x="90" y="409" fill="#333d4c" font-size="13" class="sans">Checkout a selected product</text>
  <text x="77" y="453" fill="#4d5665" font-size="13" font-weight="700" class="sans">User story</text>
  <rect x="77" y="463" width="334" height="82" rx="6" fill="#fbfbf9" stroke="#e3e4e7"/>
  <text x="91" y="488" fill="#333d4c" font-size="12" class="sans">
    <tspan x="91" dy="0">As a shopper, I want to check out</tspan>
    <tspan x="91" dy="19">a selected product so I can finish</tspan>
    <tspan x="91" dy="19">a purchase and see confirmation.</tspan>
  </text>
  <text x="77" y="579" fill="#4d5665" font-size="13" font-weight="700" class="sans">Acceptance criteria</text>
  <rect x="77" y="589" width="334" height="128" rx="6" fill="#fbfbf9" stroke="#e3e4e7"/>
  <text x="91" y="615" fill="#333d4c" font-size="12" class="sans">
    <tspan x="91" dy="0">AC-01  Cart shows the selected item</tspan>
    <tspan x="91" dy="22">AC-02  Required fields show errors</tspan>
    <tspan x="91" dy="22">AC-03  Total equals subtotal + tax</tspan>
    <tspan x="91" dy="22">AC-04  Order shows confirmation</tspan>
  </text>
  <rect x="77" y="740" width="334" height="58" rx="6" fill="#fffdf8" stroke="#f0e7d4"/>
  <text x="92" y="764" fill="#535d69" font-size="11" font-weight="700" class="sans">Use sample information only.</text>
  <text x="92" y="782" fill="#727b86" font-size="10" class="sans">Your brief is not saved in this public demo.</text>
  <rect x="458" y="181" width="932" height="665" rx="12" fill="#fff" stroke="#e8e7e0"/>
  <text x="486" y="220" fill="#7b8390" font-size="11" letter-spacing="1.7" class="mono">02 / THE TEST PLAN</text>
  <text x="486" y="251" fill="#121b2c" font-size="23" font-weight="700" class="sans">Checkout a selected product</text>
  <rect x="486" y="276" width="876" height="105" rx="8" fill="#fbfbf9" stroke="#e9e9e4"/>
  <path d="M705 276v105M924 276v105M1143 276v105" stroke="#ecece8"/>
  <text x="506" y="301" fill="#9299a1" font-size="10" letter-spacing="1" class="mono">CRITERIA COVERED</text>
  <text x="506" y="342" fill="#182235" font-size="31" font-weight="700" class="sans">100%</text>
  <text x="506" y="364" fill="#999ea4" font-size="11" class="sans">4 / 4 mapped</text>
  <text x="725" y="301" fill="#9299a1" font-size="10" letter-spacing="1" class="mono">SCENARIO TYPES</text>
  <text x="725" y="342" fill="#182235" font-size="31" font-weight="700" class="sans">9</text>
  <text x="725" y="364" fill="#999ea4" font-size="11" class="sans">happy · positive · negative · edge</text>
  <text x="944" y="301" fill="#9299a1" font-size="10" letter-spacing="1" class="mono">OPEN QUESTIONS</text>
  <text x="944" y="342" fill="#182235" font-size="31" font-weight="700" class="sans">0</text>
  <text x="944" y="364" fill="#999ea4" font-size="11" class="sans">needs clarification</text>
  <text x="1163" y="301" fill="#9299a1" font-size="10" letter-spacing="1" class="mono">GENERATOR</text>
  <text x="1163" y="338" fill="#182235" font-size="17" font-weight="700" class="sans">Local rules</text>
  <text x="1163" y="364" fill="#999ea4" font-size="11" class="sans">review each draft</text>
  <text x="495" y="421" fill="#1e293a" font-size="12" font-weight="700" class="sans">Scenario matrix</text>
  <text x="640" y="421" fill="#868c94" font-size="12" class="sans">Gherkin</text>
  <text x="727" y="421" fill="#868c94" font-size="12" class="sans">Cypress draft</text>
  <text x="846" y="421" fill="#868c94" font-size="12" class="sans">Human review</text>
  <path d="M485 438h877" stroke="#ebebe7"/>
  <text x="496" y="469" fill="#273244" font-size="15" font-weight="700" class="sans">Test scenarios</text>
  <text x="1261" y="469" fill="#92989b" font-size="10" class="mono">100% COVERAGE</text>
  <rect x="486" y="487" width="876" height="328" rx="7" fill="#fff" stroke="#ecece7"/>
  <rect x="486" y="487" width="876" height="36" rx="7" fill="#fafaf8"/>
  <text x="504" y="510" fill="#969ca3" font-size="10" letter-spacing=".7" class="mono">TRACE</text>
  <text x="610" y="510" fill="#969ca3" font-size="10" letter-spacing=".7" class="mono">SCENARIO &amp; EXPECTED RESULT</text>
  <text x="1217" y="510" fill="#969ca3" font-size="10" letter-spacing=".7" class="mono">RISK</text>
  <path d="M486 523h876M486 597h876M486 671h876M486 745h876" stroke="#f0f0ec"/>
  <text x="504" y="548" fill="#6c7890" font-size="11" class="mono">TS-05<tspan x="504" dy="17">AC-01..04</tspan></text>
  <text x="610" y="548" fill="#273244" font-size="13" font-weight="700" class="sans">Happy path: complete checkout with one product</text>
  <text x="610" y="570" fill="#68727e" font-size="11" class="sans">The order completes and each stated criterion holds.</text>
  <rect x="1273" y="539" width="67" height="24" rx="12" fill="#fae7df"/>
  <text x="1287" y="555" fill="#ad553b" font-size="10" class="mono">HIGH</text>
  <text x="1275" y="579" fill="#92989b" font-size="10" class="sans">score 6</text>
  <text x="504" y="622" fill="#6c7890" font-size="11" class="mono">TS-07<tspan x="504" dy="17">AC-02</tspan></text>
  <text x="610" y="622" fill="#273244" font-size="13" font-weight="700" class="sans">Negative: leave a required field empty</text>
  <text x="610" y="644" fill="#68727e" font-size="11" class="sans">Checkout is blocked and the field error is shown.</text>
  <rect x="1273" y="613" width="67" height="24" rx="12" fill="#fae7df"/>
  <text x="1287" y="629" fill="#ad553b" font-size="10" class="mono">HIGH</text>
  <text x="1275" y="653" fill="#92989b" font-size="10" class="sans">score 6</text>
  <text x="504" y="696" fill="#6c7890" font-size="11" class="mono">TS-08<tspan x="504" dy="17">AC-01..04</tspan></text>
  <text x="610" y="696" fill="#273244" font-size="13" font-weight="700" class="sans">Edge case: submit checkout twice after a delay</text>
  <text x="610" y="718" fill="#68727e" font-size="11" class="sans">Review whether a retry could create a duplicate order.</text>
  <rect x="1273" y="687" width="67" height="24" rx="12" fill="#fae7df"/>
  <text x="1287" y="703" fill="#ad553b" font-size="10" class="mono">HIGH</text>
  <text x="1275" y="727" fill="#92989b" font-size="10" class="sans">score 6</text>
  <text x="504" y="770" fill="#6c7890" font-size="11" class="mono">TS-09<tspan x="504" dy="17">AC-01,03</tspan></text>
  <text x="610" y="770" fill="#273244" font-size="13" font-weight="700" class="sans">Boundary: check totals near a rounding point</text>
  <text x="610" y="792" fill="#68727e" font-size="11" class="sans">Compare amounts with the agreed currency and formula.</text>
  <rect x="1273" y="761" width="67" height="24" rx="12" fill="#fae7df"/>
  <text x="1287" y="777" fill="#ad553b" font-size="10" class="mono">HIGH</text>
  <text x="1275" y="801" fill="#92989b" font-size="10" class="sans">score 6</text>
  <text x="486" y="832" fill="#898f97" font-size="10" class="sans">Generated cases are drafts. Confirm product behavior and outcomes before use.</text>
  <text x="50" y="879" fill="#969a9a" font-size="11" class="sans">Illustrative view based on the included checkout sample</text>
  <text x="1232" y="879" fill="#969a9a" font-size="11" class="sans">Human-led quality engineering</text>
</svg>
